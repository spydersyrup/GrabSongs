# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-GB
tone_instructions: Be brief and specific. Point out real bugs, regressions and simpler ways to do the same thing. Skip praise, style opinions and anything already covered by clang-format or the linters.
knowledge_base:
  code_guidelines:
    filePatterns: ["AGENTS.md"]
reviews:
  profile: chill
  # Pull request descriptions are written by hand, so the summary stays in CodeRabbit's own comment.
  high_level_summary_in_walkthrough: true
  estimate_code_review_effort: false
  in_progress_fortune: false
  suggested_reviewers: false
  pre_merge_checks:
    # Comments are only written where the reason isn't obvious, so docstring coverage isn't a goal.
    docstrings:
      mode: "off"
    description:
      mode: "off"
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  path_instructions:
    - path: "**/*"
      instructions: >-
        Review against AGENTS.md. The smallest correct change wins: flag duplicated logic, unused code, new
        abstractions with one use, new dependencies and speculative fallbacks. Don't ask for comments or
        docstrings that restate the code; a comment should explain a reason that isn't obvious. Flag comments
        that narrate the code or mention AI tools.
    - path: "bridge.py"
      instructions: >-
        The single QObject boundary Python exposes to QML. Everything QML can reach goes through a
        @pyqtProperty / @pyqtSlot here; flag any new one added elsewhere. Watch the GUI thread:
        getDownloadedFiles() walks the download directory, so work added to it must not do blocking I/O
        per file.
    - path: "core/downloader/**"
      instructions: >-
        Cancellation is cooperative and must stay that way. QThread.terminate() kills the worker mid-write
        and orphans the ffmpeg child. A new phase in DownloadWorker.run() needs a cancellation check at its
        start, because progress_hook is the only hook yt-dlp exposes. QueueManager._process_queue() is the
        only place that starts workers or advances the queue. build_base_name() is shared with the
        duplicate check in bridge.py; a second place that guesses a filename will drift from it.
    - path: "core/metadata/**"
      instructions: >-
        One class per provider, exposing class/static methods that return plain dicts or None. Never raise
        for an expected failure. Apple and Deezer use their public APIs; Spotify is scraped from
        __NEXT_DATA__ in the embed page with no fallback, so a shape change there returns nothing rather
        than raising. Flag anything that makes that failure quieter.
    - path: "qml/**"
      instructions: >-
        Reuse the existing components (LucideIcon, PressDepthIconButton, TransportButton, FilterChip,
        SettingCard, SettingRow, SettingButton, SettingSwitch, NavItem, AppToolTip, VolumeControl) instead of
        new near-copies. Read colour and font from the window root properties in GrabSongsMain.qml
        (surfaceCard, textPrimary, brandAccent, bodyFont, monoFont); flag raw hex literals and hardcoded
        font families at call sites. Icon buttons have no background or border at rest. Radii come from
        the 4/6/8 scale; flag pills and anything above 8. Accent marks small interactive state, never a
        background or a large fill. No glow, gradients or glassmorphism. Interactive items need keyboard
        focus, Enter/Space activation and an Accessible name.
    - path: "**/*.md"
      instructions: >-
        Plain, direct language for people using or contributing to the app. No marketing tone, emoji
        headings or badges beyond the existing ones. DESIGN.md holds design intent, DESIGN_SYSTEM.md the
        token values, CODE_PATTERNS.md the code conventions - they should not restate each other.